<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SwarmAI Assistant</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root {
      --bg: #f6f7fb; --panel: #ffffff; --text: #111827; --muted: #6b7280;
      --user: #2563eb; --user-text: #ffffff; --bot: #eef1f6; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1117; --panel: #171a23; --text: #e5e7eb; --muted: #9ca3af;
              --bot: #232736; --border: #2a2f3d; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; flex-direction: column; }
    header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
             display: flex; align-items: center; gap: 10px; }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    header .agents { color: var(--muted); font-size: 12px; }
    header button { background: none; border: 1px solid var(--border); color: var(--text);
                    border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
           max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .bot.err { border: 1px solid #ef4444; }
    .typing { color: var(--muted); font-style: italic; }
    .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .hints button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
                    border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
           background: var(--panel); border-top: 1px solid var(--border); }
    form > div { display: flex; gap: 8px; max-width: 820px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
               font: inherit; background: var(--bg); color: var(--text); max-height: 140px; }
    .icon-btn { width: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
                color: var(--text); font-size: 18px; cursor: pointer; flex-shrink: 0; }
    .icon-btn.send { background: var(--user); color: #fff; border-color: var(--user); }
    .icon-btn.rec { background: #ef4444; color: #fff; border-color: #ef4444; }
    .icon-btn:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="" />
    <h1>SwarmAI <span class="agents">· email · calendar · research · travel</span></h1>
    <button id="speakBtn" title="Read replies aloud">🔇 Voice off</button>
    <button id="newBtn" title="Start a new conversation">New chat</button>
  </header>

  <main id="log">
    <div class="msg bot">Hi! I'm your multi-agent assistant. Ask me about your email, calendar, any research topic, or flights &amp; hotels. Tap 🎤 to talk.</div>
    <div class="hints" id="hints">
      <button>Summarise my unread emails</button>
      <button>What's on my calendar tomorrow?</button>
      <button>Latest news on AI agents</button>
      <button>Cheapest flights Hyderabad → Goa next Friday</button>
    </div>
  </main>

  <form id="form">
    <div>
      <button type="button" class="icon-btn" id="micBtn" title="Voice input">🎤</button>
      <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
      <button type="submit" class="icon-btn send" id="sendBtn" title="Send">➤</button>
    </div>
  </form>

  <script>
    const API_URL = '/api/assistant';            // nginx -> n8n /webhook/assistant
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const form = document.getElementById('form');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const speakBtn = document.getElementById('speakBtn');

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    let sessionId = store.get('swarm.sessionId') || newId();
    store.set('swarm.sessionId', sessionId);
    let speak = store.get('swarm.speak') === '1';
    const renderSpeak = () => { speakBtn.textContent = speak ? '🔊 Voice on' : '🔇 Voice off'; };
    renderSpeak();

    function add(text, cls) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      document.getElementById('hints')?.remove();
      add(text, 'user');
      input.value = ''; autosize();
      sendBtn.disabled = true;
      const pending = add('Thinking… (routing to agents)', 'bot typing');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — is the Master Agent workflow active?');
        const data = await res.json();
        pending.className = 'msg bot';
        pending.textContent = data.reply || '(empty reply)';
        if (speak && 'speechSynthesis' in window) {
          speechSynthesis.cancel();
          speechSynthesis.speak(new SpeechSynthesisUtterance(pending.textContent));
        }
      } catch (e) {
        pending.className = 'msg bot err';
        pending.textContent = 'Error: ' + e.message;
      } finally {
        sendBtn.disabled = false;
        log.scrollTop = log.scrollHeight;
      }
    }

    function autosize() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
    input.addEventListener('input', autosize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
    document.getElementById('hints').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') send(e.target.textContent);
    });
    speakBtn.onclick = () => { speak = !speak; store.set('swarm.speak', speak ? '1' : '0'); renderSpeak(); };
    document.getElementById('newBtn').onclick = () => {
      sessionId = newId(); store.set('swarm.sessionId', sessionId);
      log.innerHTML = '';
      add('New conversation started.', 'bot');
    };

    // Voice control: browser speech-to-text (Chrome / Edge / Safari).
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = 'Voice input not supported in this browser';
    } else {
      const rec = new SR();
      rec.lang = navigator.language || 'en-US';
      rec.interimResults = true;
      let listening = false;
      rec.onresult = (e) => {
        const t = Array.from(e.results).map(r => r[0].transcript).join('');
        input.value = t; autosize();
        if (e.results[e.results.length - 1].isFinal) send(t);
      };
      rec.onend = () => { listening = false; micBtn.classList.remove('rec'); };
      rec.onerror = () => { listening = false; micBtn.classList.remove('rec'); };
      micBtn.onclick = () => {
        if (listening) { rec.stop(); return; }
        listening = true; micBtn.classList.add('rec'); rec.start();
      };
    }
  </script>
</body>
</html>
